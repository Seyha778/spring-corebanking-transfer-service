
spring:

  # PostgreSQL
  datasource:
    url: jdbc:postgresql://localhost:5432/digital
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 1
      minimum-idle: 1
      connection-timeout: 30000

  # JPA / Hibernate
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  # Redis
  cache:
    type: redis

  data:
    redis:
      host: localhost
      port: 6379
      username: default
      password: mypassword
      timeout: 30000ms

# Local development logging
logging:
  level:
    org.springframework.kafka: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.data.redis: INFO